---
layout: default
---
<article class="note">
  <header class="note-header">
    <h1>{{ page.title }}</h1>
    <p class="note-meta">
      {%- if page.date %}
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
      {%- endif %}
      {%- for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {%- endfor %}
    </p>
    {%- if page.summary %}
    <p class="note-summary">{{ page.summary }}</p>
    {%- endif %}
  </header>

  <aside class="toc" aria-label="本页目录">
    <button class="toc-title" type="button" aria-expanded="false">本页目录</button>
    <nav class="toc-nav" id="toc-nav"></nav>
  </aside>

  <div class="note-body" id="note-body">
    {{ content }}
  </div>
</article>
